[project]
name = "parabank-postman"
version = "1.0.0"
description = "Коллекции Postman для ParaBank (REST и SOAP), линтер коллекций и мутационная проверка через mitmproxy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2,<13",
]

[project.scripts]
pbqa = "pbqa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Предупреждения внутри зависимостей mitmproxy (ldap3, pyasn1) — не про этот проект.
filterwarnings = ["ignore::DeprecationWarning:ldap3.*", "ignore:.*deprecated:DeprecationWarning:mitmproxy.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["pbqa"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
